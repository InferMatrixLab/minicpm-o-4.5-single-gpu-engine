[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpmo-single-gpu-engine"
version = "0.1.0"
description = "Single-GPU MiniCPM-o 4.5 streaming speech engine and reproducible streaming evaluation"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11", "pre-commit>=4"]

[tool.setuptools.packages.find]
include = ["engine*", "bench*", "evals*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["F", "E9"]
